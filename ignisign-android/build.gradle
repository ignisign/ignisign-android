plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'io.ignisign.ignisign_android'
    compileSdk 34

    defaultConfig {
        //applicationId "io.ignisign.ignisign_android"
        aarMetadata {
            minCompileSdk = 29
        }
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // SECURITY: Enable code shrinking and obfuscation for release builds
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    // SECURITY: Updated dependencies to latest stable versions to fix known CVEs
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // OkHttp 4.12.1 - latest 4.x, no known CVEs
    implementation("com.squareup.okhttp3:okhttp:4.12.1")
    // Gson 2.15.0 - latest stable 2.x, no known CVEs
    implementation 'com.google.code.gson:gson:2.15.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

